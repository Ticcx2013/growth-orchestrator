{% extends "base.html" %}
{% block title %} · Operations{% endblock %}
{% block content %}
<div x-data="ops()" x-init="loadAll()" class="space-y-5">
  <div class="flex items-center justify-between gap-6">
    <div>
      <h1 class="text-lg font-semibold" x-text="t('ops.title')"></h1>
      <p class="text-sm text-slate-500" x-text="t('ops.subtitle')"></p>
    </div>
    <div class="flex items-center gap-2 text-sm shrink-0">
      <button @click="tick(60)" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50" x-text="t('ops.tick')"></button>
      <button @click="loadAll()" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white" x-text="t('ops.refresh')"></button>
    </div>
  </div>

  <div class="flex gap-1 border-b border-slate-200 text-sm">
    <template x-for="tb in tabs" :key="tb">
      <button @click="tab = tb" class="px-3 py-2 -mb-px border-b-2" :class="tab === tb ? 'border-indigo-600 text-indigo-700 font-medium' : 'border-transparent text-slate-500 hover:text-slate-800'">
        <span x-text="t('ops.tab.' + tb)"></span> <span class="ml-1 text-xs text-slate-400" x-text="count(tb)"></span>
      </button>
    </template>
  </div>

  <!-- Review queue -->
  <section x-show="tab === 'review'" x-cloak class="space-y-3">
    <template x-if="review.length === 0"><div class="card p-6 text-slate-500 text-sm" x-text="t('ops.review.empty')"></div></template>
    <template x-for="r in review" :key="r.id">
      <div class="card p-4">
        <div class="flex items-start justify-between gap-4">
          <div class="space-y-1 text-sm min-w-0">
            <div class="flex items-center gap-2">
              <span class="mono text-xs text-slate-400" x-text="'#' + r.id"></span>
              <span class="font-medium" x-text="isPlain() ? (contactName(r.contact_id) + ' · ' + accountName(r.account_id)) : (r.contact_id + ' · ' + r.account_id)"></span>
              <span class="text-xs px-1.5 py-0.5 rounded bg-orange-100 text-orange-700" x-text="t('rstatus.' + r.status)"></span>
            </div>
            <blockquote x-show="r.event_payload.text" class="italic text-slate-700 border-l-2 border-slate-300 pl-2">“<span x-text="r.event_payload.text"></span>”</blockquote>
            <div class="text-slate-600" x-show="!isPlain()" x-text="r.reason"></div>
            <div class="text-xs text-slate-500"><span x-text="t('ops.review.system') + ': '"></span><span :class="!isPlain() && 'mono'" x-text="tAction(r.decision_action)"></span>
              <template x-if="r.proposed_action"><span> · <span x-text="t('ops.review.proposed')"></span>: <span :class="!isPlain() && 'mono'" x-text="tAction(r.proposed_action)"></span></span></template>
            </div>
            <template x-if="r.ai">
              <div class="mt-1 rounded-lg bg-pink-50 border border-pink-100 px-3 py-2 text-xs text-slate-700">
                <span class="font-medium text-pink-700" x-text="t('ops.review.model') + ':'"></span> <span x-text="tIntent(r.ai.intent)"></span> · <span x-text="t('ops.review.confidence')"></span> <span x-text="Math.round(r.ai.confidence * 100) + '%'"></span>
                <template x-if="r.ai.risk_flags && r.ai.risk_flags.length && !isPlain()"><span> · <span x-text="t('ops.review.flags')"></span> <span class="mono" x-text="r.ai.risk_flags.join(', ')"></span></span></template>
                <div x-text="summaryOf(r.ai)"></div>
                <template x-if="r.ai.extracted && factsWords(r.ai.extracted)">
                  <div class="text-[11px] text-slate-500" :class="!isPlain() && 'mono'" x-text="factsWords(r.ai.extracted)"></div>
                </template>
              </div>
            </template>
          </div>
          <div x-show="r.status === 'open'" class="flex flex-col gap-2 shrink-0">
            <button @click="approve(r)" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-sm" x-text="r.proposed_action ? t('ops.review.approve') + ': ' + tAction(r.proposed_action) : t('ops.review.close')"></button>
            <button @click="reject(r)" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm" x-text="t('ops.review.reject')"></button>
          </div>
        </div>
      </div>
    </template>
    <label class="text-xs text-slate-500 flex items-center gap-2"><input type="checkbox" x-model="showResolved" @change="loadReview()"> <span x-text="t('ops.show_resolved')"></span></label>
  </section>

  <!-- Outbox -->
  <section x-show="tab === 'actions'" x-cloak class="card overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
        <tr><th class="p-3 mono-hide" x-text="t('ops.col.key')"></th><th class="p-3" x-text="t('ops.col.type')"></th><th class="p-3" x-text="t('ops.col.target')"></th><th class="p-3" x-text="t('ops.col.status')"></th><th class="p-3" x-text="t('ops.col.attempts')"></th><th class="p-3" x-text="t('ops.col.next')"></th><th class="p-3 mono-hide" x-text="t('ops.col.ref')"></th><th class="p-3" x-text="t('ops.col.error')"></th></tr>
      </thead>
      <tbody>
        <template x-for="a in actions" :key="a.idempotency_key">
          <tr class="border-t border-slate-100">
            <td class="p-3 mono text-xs mono-hide" x-text="a.idempotency_key"></td>
            <td class="p-3 text-xs" :class="!isPlain() && 'mono'" x-text="tAction(a.type)"></td>
            <td class="p-3 text-xs" x-text="a.target_system"></td>
            <td class="p-3"><span class="text-xs px-1.5 py-0.5 rounded" :class="statusClass(a.status)" x-text="t('status.' + a.status)"></span></td>
            <td class="p-3" x-text="a.attempts"></td>
            <td class="p-3 text-xs text-slate-500" x-text="['pending','uncertain'].includes(a.status) && a.next_attempt_at ? a.next_attempt_at.slice(11, 19) + 'Z' : ''"></td>
            <td class="p-3 mono text-xs mono-hide" x-text="a.external_ref || ''"></td>
            <td class="p-3 text-xs text-red-600" x-text="a.last_error || ''"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <!-- Audit -->
  <section x-show="tab === 'audit'" x-cloak class="card p-2">
    <template x-for="tr in audit" :key="tr.id">
      <details class="px-2">
        <summary class="flex items-start gap-2 py-1 rounded hover:bg-slate-50 text-sm">
          <span class="mono text-[11px] text-slate-400 w-20 shrink-0" x-text="tr.created_at.slice(11, 19)"></span>
          <span class="mono text-[11px] text-slate-500 w-32 shrink-0 truncate mono-hide" x-text="tr.event_id || '—'"></span>
          <span class="stage-pill text-[11px] px-1.5 py-0.5 rounded shrink-0 w-40 text-center" :class="'stage-' + tr.stage + (isPlain() ? '' : ' mono')" x-text="stageLabel(tr.stage)"></span>
          <span x-text="stageText(tr)"></span>
        </summary>
        <pre x-show="tr.data && !isPlain()" class="mono text-[11px] bg-slate-50 border rounded-lg p-3 my-1 overflow-x-auto max-h-64" x-text="fmtJSON(tr.data)"></pre>
      </details>
    </template>
  </section>

  <!-- AI calls -->
  <section x-show="tab === 'ai'" x-cloak class="space-y-2">
    <template x-for="c in aiCalls" :key="c.id">
      <details class="card p-3">
        <summary class="flex items-center gap-3 text-sm">
          <span class="text-xs px-1.5 py-0.5 rounded" :class="c.valid ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'" x-text="t(c.valid ? 'ops.valid' : 'ops.invalid')"></span>
          <span class="mono text-xs text-slate-500 mono-hide" x-text="c.mode + ' · ' + c.model + ' · ' + c.prompt_version + ' · ' + t('ops.attempt') + ' ' + c.attempt"></span>
          <span class="truncate italic text-slate-700">“<span x-text="c.input_text"></span>”</span>
          <span class="ml-auto text-xs text-slate-500 shrink-0" x-show="!isPlain()" x-text="(c.latency_ms ? c.latency_ms + ' ms · ' : '') + (c.input_tokens ? c.input_tokens + '/' + c.output_tokens + ' tok' : '')"></span>
        </summary>
        <template x-if="isPlain() && c.parsed">
          <div class="text-sm mt-2 rounded-lg bg-pink-50 border border-pink-100 px-3 py-2">
            <div><b x-text="tIntent(c.parsed.intent)"></b> · <span x-text="t('ops.review.confidence') + ' ' + Math.round(c.parsed.confidence * 100) + '%'"></span></div>
            <div class="text-slate-700" x-text="summaryOf(c.parsed)"></div>
          </div>
        </template>
        <pre x-show="!isPlain()" class="mono text-[11px] bg-slate-50 border rounded-lg p-3 mt-2 overflow-x-auto" x-text="fmtJSON(c.parsed || c.validation_errors)"></pre>
        <div x-show="c.validation_errors.length" class="text-xs text-red-600 mt-1" x-text="t('ops.validation') + ': ' + c.validation_errors.join('; ')"></div>
      </details>
    </template>
  </section>

  <!-- State -->
  <section x-show="tab === 'state'" x-cloak class="grid grid-cols-12 gap-4">
    <div class="col-span-12 lg:col-span-5 card overflow-hidden">
      <div class="p-3 text-xs uppercase tracking-wide text-slate-500 bg-slate-50" x-text="t('ops.state.accounts')"></div>
      <table class="w-full text-xs">
        <template x-for="a in state.accounts" :key="a.id">
          <tr class="border-t border-slate-100">
            <td class="p-2"><div class="font-medium" x-text="a.name"></div><div class="text-slate-500" x-text="a.country + ' · ' + a.employee_count + ' emp' + (isPlain() ? '' : ' · v' + a.state_version)"></div></td>
            <td class="p-2 text-right space-x-1">
              <span x-show="a.is_customer" class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700" x-text="t('ops.customer')"></span>
              <span x-show="a.has_open_opportunity" class="px-1.5 py-0.5 rounded bg-sky-100 text-sky-700" x-text="t('ops.opp') + ' ' + (a.owner_ae_id || '?')"></span>
            </td>
          </tr>
        </template>
      </table>
    </div>
    <div class="col-span-12 lg:col-span-7 card overflow-hidden">
      <div class="p-3 text-xs uppercase tracking-wide text-slate-500 bg-slate-50" x-text="t('ops.state.contacts')"></div>
      <table class="w-full text-xs">
        <template x-for="c in state.contacts" :key="c.id">
          <tr class="border-t border-slate-100">
            <td class="p-2"><div class="font-medium" x-text="c.name"></div><div class="text-slate-500 mono" x-text="c.email"></div></td>
            <td class="p-2 text-slate-500" x-text="isPlain() ? accountName(c.account_id) : c.account_id"></td>
            <td class="p-2"><span class="px-1.5 py-0.5 rounded" :class="contactClass(c.status)" x-text="t('cstatus.' + c.status)"></span></td>
            <td class="p-2 text-slate-500" x-text="(isPlain() ? '' : c.sequence_status) + (c.wait_until ? (isPlain() ? '' : ' ') + '→ ' + c.wait_until : '')"></td>
          </tr>
        </template>
      </table>
    </div>
    <div class="col-span-12 card p-3">
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-2" x-text="t('ops.state.suppressions')"></div>
      <div class="flex flex-wrap gap-2">
        <template x-for="s in state.suppressions" :key="s.id"><span class="mono text-xs px-2 py-1 rounded bg-red-50 text-red-700 border border-red-200" x-text="s.key + ' (' + s.reason + ')'"></span></template>
      </div>
    </div>
  </section>

  <!-- CRM -->
  <section x-show="tab === 'crm'" x-cloak class="card overflow-hidden">
    <div class="p-3 text-xs text-slate-500 bg-slate-50" x-text="t('ops.crm.hint')"></div>
    <table class="w-full text-xs">
      <thead class="text-left text-slate-500"><tr><th class="p-2" x-text="t('ops.col.kind')"></th><th class="p-2" x-text="t('ops.col.id')"></th><th class="p-2 mono-hide" x-text="t('ops.col.key')"></th><th class="p-2" x-text="t('ops.col.data')"></th></tr></thead>
      <template x-for="r in crm.records" :key="r.id">
        <tr class="border-t border-slate-100 align-top">
          <td class="p-2 font-medium" x-text="r.kind"></td><td class="p-2 mono" x-text="r.id"></td><td class="p-2 mono mono-hide" x-text="r.idempotency_key"></td>
          <td class="p-2 mono text-slate-500" x-text="JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k]) => !['id','kind','idempotency_key'].includes(k))))"></td>
        </tr>
      </template>
    </table>
  </section>
</div>

<script>
function ops() {
  return {
    tab: 'review', showResolved: false,
    tabs: ['review', 'actions', 'audit', 'ai', 'state', 'crm'],
    review: [], actions: [], audit: [], aiCalls: [], state: { accounts: [], contacts: [], suppressions: [] }, crm: { records: [] },
    count(k) { return { review: this.review.filter(r => r.status === 'open').length, actions: this.actions.length, audit: this.audit.length, ai: this.aiCalls.length, state: this.state.contacts.length, crm: this.crm.records.length }[k] || ''; },
    accountName(id) { const a = this.state.accounts.find(x => x.id === id); return a ? a.name : id; },
    contactName(id) { const c = this.state.contacts.find(x => x.id === id); return c ? c.name : id; },
    summaryOf(ai) { return (window.prefs.lang === 'es' && ai.summary_es) ? ai.summary_es : ai.summary; },
    factsWords(ex) {
      const L = window.prefs.lang === 'es'
        ? { referral_email: 'correo del referido', referral_name: 'nombre del referido', return_date: 'regresa el', follow_up_date: 'volver a contactar el', proposed_meeting: 'propone', company_size: 'tamaño de empresa', current_tool: 'herramienta actual' }
        : { referral_email: 'referral email', referral_name: 'referral name', return_date: 'back on', follow_up_date: 'follow up on', proposed_meeting: 'proposes', company_size: 'company size', current_tool: 'current tool' };
      const parts = Object.entries(ex).filter(([k, v]) => v && !(Array.isArray(v)) && L[k]).map(([k, v]) => (isPlain() ? L[k] : k) + ': ' + v);
      return parts.join(' · ');
    },
    async loadReview() { this.review = await api('/api/review?status=' + (this.showResolved ? 'all' : 'open')); },
    async loadAll() {
      [this.actions, this.audit, this.aiCalls, this.state, this.crm] = await Promise.all([api('/api/actions'), api('/api/audit'), api('/api/ai_calls'), api('/api/state'), api('/api/crm')]);
      await this.loadReview();
    },
    async approve(r) { await api('/api/review/' + r.id + '/approve', { method: 'POST', body: JSON.stringify({ by: 'console' }) }); await this.loadAll(); },
    async reject(r) { await api('/api/review/' + r.id + '/reject', { method: 'POST', body: JSON.stringify({ by: 'console' }) }); await this.loadAll(); },
    async tick(s) { await api('/api/outbox/tick?advance_seconds=' + s, { method: 'POST' }); await this.loadAll(); },
    statusClass(s) { return { succeeded: 'bg-emerald-100 text-emerald-700', uncertain: 'bg-amber-100 text-amber-700', pending: 'bg-sky-100 text-sky-700', in_flight: 'bg-sky-100 text-sky-700', failed: 'bg-red-100 text-red-700', dead: 'bg-red-100 text-red-700' }[s] || 'bg-slate-100'; },
    contactClass(s) { return { active: 'bg-slate-100 text-slate-700', handed_off: 'bg-emerald-100 text-emerald-700', waiting: 'bg-sky-100 text-sky-700', suppressed: 'bg-red-100 text-red-700', nurture: 'bg-violet-100 text-violet-700' }[s] || ''; },
  };
}
</script>
{% endblock %}
